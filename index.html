<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sai</title>
<style>
:root {
  --bg: #05080f;
  --panel: #0b1220;
  --line: #16314a;
  --cyan: #4fd8ff;
  --cyan-dim: #1d6f8a;
  --ink: #d8eefa;
  --muted: #7f9bb0;
  --warn: #ffb454;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: radial-gradient(ellipse at 50% 0%, #0b1a2c 0%, var(--bg) 60%); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5; }
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
h1 { margin: 0; font-size: 22px; letter-spacing: .5em; font-weight: 600; color: var(--cyan); padding-left: .5em; }
#status { color: var(--muted); font-size: 14px; min-height: 21px; text-align: center; }

.reactor { width: 300px; height: 300px; position: relative; margin: 4px auto; }
.reactor canvas { width: 100%; height: 100%; display: block; }

.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: center; }
.options { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: center; }
button { font: 600 15px "Segoe UI", system-ui, sans-serif; border-radius: 10px; padding: 10px 20px; border: 1px solid var(--cyan); background: transparent; color: var(--cyan); cursor: pointer; }
button.main { background: var(--cyan); color: #04202b; }
button.small { padding: 6px 12px; font-size: 13px; }
button:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
label { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }

.heard { color: var(--muted); font-size: 14px; min-height: 21px; text-align: center; font-style: italic; }
.log { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; max-height: 460px; min-height: 60px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.msg { font-size: 15px; display: flex; gap: 12px; }
.msg b { flex: 0 0 44px; color: var(--cyan); font-weight: 600; }
.msg.you b { color: var(--muted); }
.msg span { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.typebox { width: 100%; display: flex; gap: 8px; }
input[type="text"], input[type="password"] { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: 15px "Segoe UI", system-ui, sans-serif; }
details { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.set { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.set label { flex-direction: column; align-items: stretch; gap: 4px; cursor: default; }
.hint { color: var(--muted); font-size: 13px; text-align: center; }
.warn { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <h1>SAI</h1>
  <div id="status">Press Start Sai</div>
  <div class="reactor idle" id="reactor"><canvas id="orb" width="300" height="300" aria-hidden="true"></canvas></div>

  <div class="controls">
    <button class="main" id="start" type="button">Start Sai</button>
    <button class="small" id="newchat" type="button">New chat</button>
  </div>
  <div class="options">
    <label><input type="checkbox" id="wake" checked> Wait for the word "Sai"</label>
    <label><input type="checkbox" id="detail"> Detailed answers</label>
    <label><input type="checkbox" id="mute"> Mute voice</label>
  </div>
  <div class="heard" id="heard"></div>
  <div class="log" id="log" aria-live="polite"></div>

  <div class="typebox">
    <input type="text" id="typed" placeholder="Or type to Sai and press Enter" aria-label="Type a message to Sai">
    <button type="button" id="send">Send</button>
  </div>

  <details id="settings" open>
    <summary>Settings</summary>
    <div class="set">
      <label>Web app link from Apps Script (ends with /exec)<input type="text" id="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <label>Your passphrase (SAI_SECRET)<input type="password" id="secret" autocomplete="off"></label>
      <button type="button" id="save">Save settings</button>
    </div>
  </details>
  <div class="hint" id="hint">Try: "Sai, give me my morning briefing." Tick Detailed answers for longer replies on screen. Use Chrome or Edge.</div>
</div>

<script>
// Iron Man style HUD animation. It reads the state from the class on #reactor (idle, listening, thinking, speaking).
(function () {
  var box = document.getElementById("reactor");
  var cv = document.getElementById("orb");
  if (!cv || !cv.getContext) { return; }
  var ctx = cv.getContext("2d");
  var S = 300, dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = S * dpr; cv.height = S * dpr; ctx.scale(dpr, dpr);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var TAU = Math.PI * 2, cx = S / 2, cy = S / 2;
  var CY = "79,216,255", WARM = "255,180,84";

  var cur = { speed: 1, glow: 0.3, bars: 0.05, core: 1 };
  var goal = {
    idle:      { speed: 0.6, glow: 0.25, bars: 0.04, core: 0.9 },
    listening: { speed: 1.2, glow: 0.5,  bars: 0.18, core: 1.05 },
    thinking:  { speed: 4.5, glow: 0.8,  bars: 0.12, core: 1.0 },
    speaking:  { speed: 1.8, glow: 0.95, bars: 0.75, core: 1.15 }
  };
  var ang = [0, 0, 0, 0], t = 0;
  var barPh = [], i;
  for (i = 0; i < 72; i++) { barPh.push(Math.random() * TAU); }

  function mode() {
    var c = box.className;
    if (c.indexOf("speaking") >= 0) { return "speaking"; }
    if (c.indexOf("thinking") >= 0) { return "thinking"; }
    if (c.indexOf("listening") >= 0) { return "listening"; }
    return "idle";
  }
  function arc(r, a0, a1, w, col, al) {
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1);
    ctx.lineWidth = w; ctx.strokeStyle = "rgba(" + col + "," + al + ")"; ctx.stroke();
  }
  function ticks(r, n, len, w, al, rot, every, longer) {
    ctx.lineWidth = w;
    for (var k = 0; k < n; k++) {
      var a = rot + k * TAU / n, L = (k % every === 0) ? longer : len;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.lineTo(cx + Math.cos(a) * (r - L), cy + Math.sin(a) * (r - L));
      ctx.strokeStyle = "rgba(" + CY + "," + al + ")"; ctx.stroke();
    }
  }

  function frame() {
    t += 0.016;
    var m = mode(), g = goal[m], k;
    for (k in cur) { cur[k] += (g[k] - cur[k]) * 0.05; }
    var sp = reduce ? 0 : cur.speed;
    ang[0] += 0.004 * sp; ang[1] -= 0.007 * sp; ang[2] += 0.012 * sp; ang[3] -= 0.02 * sp;

    ctx.clearRect(0, 0, S, S);
    ctx.lineCap = "butt";

    // soft halo
    var halo = ctx.createRadialGradient(cx, cy, 10, cx, cy, 140);
    halo.addColorStop(0, "rgba(" + CY + "," + (cur.glow * 0.28).toFixed(3) + ")");
    halo.addColorStop(1, "rgba(" + CY + ",0)");
    ctx.fillStyle = halo; ctx.fillRect(0, 0, S, S);

    // outer thin ring with tick marks
    arc(142, 0, TAU, 1, CY, 0.35);
    ticks(142, 120, 5, 1, 0.45, ang[0], 10, 11);

    // second ring: segmented arcs rotating one way
    var j;
    for (j = 0; j < 6; j++) {
      var s0 = ang[1] + j * TAU / 6;
      arc(124, s0, s0 + 0.62, 4, CY, 0.5 + cur.glow * 0.4);
    }
    arc(124, 0, TAU, 1, CY, 0.18);

    // third ring: dashed, spinning the other way, with warm accent arcs
    ctx.setLineDash([3, 7]);
    arc(106, ang[2], ang[2] + TAU, 2, CY, 0.7);
    ctx.setLineDash([]);
    arc(106, ang[3], ang[3] + 0.9, 3, WARM, 0.45 + cur.glow * 0.3);
    arc(106, ang[3] + Math.PI, ang[3] + Math.PI + 0.9, 3, WARM, 0.45 + cur.glow * 0.3);

    // radial sound bars between inner rings
    var wob = m === "speaking" ? 1 : 0.5;
    for (j = 0; j < 72; j++) {
      var a = j * TAU / 72 + ang[0] * 0.5;
      var h = 3 + (Math.sin(t * (m === "speaking" ? 9 : 2.5) + barPh[j]) * 0.5 + 0.5) * 22 * cur.bars * wob * 3;
      var r0 = 70;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * (r0 + h), cy + Math.sin(a) * (r0 + h));
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(" + CY + "," + (0.35 + cur.glow * 0.5).toFixed(3) + ")"; ctx.stroke();
    }

    // inner solid ring and triangle marker
    arc(62, 0, TAU, 2, CY, 0.6);
    arc(54, ang[3] * 1.5, ang[3] * 1.5 + 2.2, 3, CY, 0.8);
    arc(54, ang[3] * 1.5 + Math.PI, ang[3] * 1.5 + Math.PI + 2.2, 3, CY, 0.8);

    // glowing core
    var pulse = cur.core * (1 + Math.sin(t * (m === "speaking" ? 10 : 2)) * (m === "speaking" ? 0.08 : 0.04));
    var cr = 38 * pulse;
    var core = ctx.createRadialGradient(cx, cy, 2, cx, cy, cr);
    core.addColorStop(0, "rgba(235,251,255,1)");
    core.addColorStop(0.45, "rgba(" + CY + ",0.95)");
    core.addColorStop(1, "rgba(10,79,102,0.25)");
    ctx.shadowColor = "rgba(" + CY + ",0.9)"; ctx.shadowBlur = 20 + cur.glow * 30;
    ctx.beginPath(); ctx.arc(cx, cy, cr, 0, TAU); ctx.fillStyle = core; ctx.fill();
    ctx.shadowBlur = 0;

    // thin cross hairs
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(" + CY + ",0.25)";
    ctx.beginPath(); ctx.moveTo(cx - 150, cy); ctx.lineTo(cx - 46, cy); ctx.moveTo(cx + 46, cy); ctx.lineTo(cx + 150, cy);
    ctx.moveTo(cx, cy - 150); ctx.lineTo(cx, cy - 46); ctx.moveTo(cx, cy + 46); ctx.lineTo(cx, cy + 150); ctx.stroke();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var cfg = { url: "", secret: "" };
  var sid = null;
  try {
    cfg.url = localStorage.getItem("sai_url") || "";
    cfg.secret = localStorage.getItem("sai_secret") || "";
    sid = localStorage.getItem("sai_sid");
  } catch (e) {}

  function newSid() {
    var c = "abcdefghijklmnopqrstuvwxyz0123456789", s = "";
    for (var i = 0; i < 20; i++) { s += c.charAt(Math.floor(Math.random() * c.length)); }
    return s;
  }
  if (!sid) {
    sid = newSid();
    try { localStorage.setItem("sai_sid", sid); } catch (e) {}
  }

  $("url").value = cfg.url;
  $("secret").value = cfg.secret;
  if (cfg.url && cfg.secret) { $("settings").open = false; }

  var rec = null, listening = false, speaking = false, busy = false, awaiting = false;

  function setStatus(text, mode) {
    $("status").textContent = text;
    $("reactor").className = "reactor " + mode;
  }
  function addLog(who, text) {
    var row = document.createElement("div");
    row.className = "msg " + (who === "You" ? "you" : "sai");
    var b = document.createElement("b"); b.textContent = who;
    var s = document.createElement("span"); s.textContent = text;
    row.appendChild(b); row.appendChild(s);
    $("log").appendChild(row);
    $("log").scrollTop = $("log").scrollHeight;
  }

  $("save").addEventListener("click", function () {
    cfg.url = $("url").value.trim();
    cfg.secret = $("secret").value.trim();
    try { localStorage.setItem("sai_url", cfg.url); localStorage.setItem("sai_secret", cfg.secret); } catch (e) {}
    $("settings").open = false;
    setStatus("Settings saved", "idle");
  });

  $("newchat").addEventListener("click", function () {
    sid = newSid();
    try { localStorage.setItem("sai_sid", sid); } catch (e) {}
    $("log").textContent = "";
    $("heard").textContent = "";
    setStatus(listening ? "New chat. Listening..." : "New chat started", listening ? "listening" : "idle");
  });

  function pickVoice() {
    var v = window.speechSynthesis.getVoices();
    var tests = [/Google UK English Male/i, /Microsoft (Ryan|George|Thomas|Prabhat)/i, /Daniel/i, /en-GB/i, /en-IN/i, /^en/i];
    for (var i = 0; i < tests.length; i++) {
      for (var j = 0; j < v.length; j++) {
        if (tests[i].test(v[j].name) || tests[i].test(v[j].lang)) { return v[j]; }
      }
    }
    return null;
  }

  function startRec() {
    if (!listening || speaking || busy || !rec) { return; }
    try { rec.start(); } catch (e) {}
    setStatus(awaiting ? "Yes? I'm listening..." : "Listening...", "listening");
  }

  function say(text) {
    speaking = true;
    if (rec) { try { rec.stop(); } catch (e) {} }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var voice = pickVoice();
    if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-GB"; }
    u.rate = 1;
    u.pitch = 0.9;
    var done = function () {
      speaking = false;
      if (listening) { setTimeout(startRec, 300); } else { setStatus("Ready", "idle"); }
    };
    u.onend = done;
    u.onerror = done;
    setStatus("Speaking...", "speaking");
    window.speechSynthesis.speak(u);
  }

  function speakOrSkip(text) {
    if ($("mute").checked) {
      speaking = false;
      if (listening) { setTimeout(startRec, 200); } else { setStatus("Ready", "idle"); }
      return;
    }
    say(text);
  }

  function ask(text) {
    if (!cfg.url || !cfg.secret) {
      $("settings").open = true;
      addLog("Sai", "Please add my web app link and passphrase in Settings.");
      speakOrSkip("Please add my web app link and passphrase in settings.");
      return;
    }
    addLog("You", text);
    busy = true;
    setStatus("Thinking...", "thinking");
    var detailed = $("detail").checked;
    var cbName = "saicb" + Date.now();
    var script = document.createElement("script");
    var finished = false;
    var timer = null;

    function finish(d) {
      if (finished) { return; }
      finished = true;
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) { script.parentNode.removeChild(script); }
      busy = false;
      if (d && d.error) {
        var msg = d.error === "Wrong secret" ? "That passphrase was rejected. Please check settings." : "Something went wrong on my side.";
        addLog("Sai", msg + " (" + String(d.error).slice(0, 140) + ")");
        speakOrSkip(msg);
      } else if (d && d.reply) {
        var reply = String(d.reply);
        var spoken = reply, shown = reply;
        if (detailed) {
          var parts = reply.split(/\n\s*---+\s*\n/);
          if (parts.length > 1) {
            spoken = parts[0].trim();
            shown = parts[0].trim() + "\n\n" + parts.slice(1).join("\n\n").trim();
          }
        }
        addLog("Sai", shown);
        speakOrSkip(spoken);
      } else {
        addLog("Sai", "I got an empty reply.");
        speakOrSkip("I got an empty reply.");
      }
    }

    window[cbName] = finish;
    timer = setTimeout(function () { finish({ error: "Timed out waiting for the backend" }); }, 90000);
    var payload = JSON.stringify({ text: text.slice(0, 1500), sid: sid, detail: detailed ? 1 : 0 });
    var url = cfg.url + (cfg.url.indexOf("?") < 0 ? "?" : "&") + "callback=" + cbName +
      "&secret=" + encodeURIComponent(cfg.secret) +
      "&q=" + encodeURIComponent(payload);

    function viaScript() {
      script.referrerPolicy = "no-referrer";
      script.onerror = function () { finish({ error: "Could not load the backend. Check the link, and that the latest version is deployed." }); };
      script.src = url;
      document.body.appendChild(script);
    }

    // First try fetch without cookies (avoids Google sign-in conflicts); fall back to the script tag.
    var tried = false;
    try {
      fetch(url, { method: "GET", credentials: "omit", redirect: "follow", referrerPolicy: "no-referrer" })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var a = t.indexOf("("), b = t.lastIndexOf(")");
          if (a < 0 || b < a) { throw new Error("bad reply"); }
          finish(JSON.parse(t.slice(a + 1, b)));
        })
        .catch(function () { if (!finished && !tried) { tried = true; viaScript(); } });
    } catch (e) { viaScript(); }
  }

  function handleHeard(t) {
    if (!t || busy || speaking) { return; }
    $("heard").textContent = t;
    var cmd = t;
    if ($("wake").checked && !awaiting) {
      var m = t.match(/\b(sai|sigh|sy|shy|cy)\b[,.!?]?\s*(.*)$/i);
      if (!m) { return; }
      cmd = m[2].trim();
      if (!cmd) { awaiting = true; speakOrSkip("Yes?"); return; }
    }
    awaiting = false;
    ask(cmd);
  }

  function makeRec() {
    rec = new SR();
    rec.lang = "en-IN";
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = function (ev) {
      var interim = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var r = ev.results[i];
        if (r.isFinal) { handleHeard(r[0].transcript.trim()); } else { interim += r[0].transcript; }
      }
      if (interim) { $("heard").textContent = interim; }
    };
    rec.onerror = function (ev) {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        listening = false;
        $("start").textContent = "Start Sai";
        setStatus("Microphone blocked. Allow it in the address bar, then press Start again.", "idle");
      }
    };
    rec.onend = function () {
      if (listening && !speaking && !busy) { setTimeout(startRec, 300); }
    };
  }

  $("start").addEventListener("click", function () {
    if (listening) {
      listening = false; awaiting = false;
      try { rec.stop(); } catch (e) {}
      window.speechSynthesis.cancel();
      $("start").textContent = "Start Sai";
      setStatus("Ready", "idle");
      return;
    }
    if (!SR) {
      setStatus("This browser cannot listen. Please use Chrome or Edge.", "idle");
      $("hint").className = "hint warn";
      return;
    }
    if (!rec) { makeRec(); }
    listening = true;
    $("start").textContent = "Stop Sai";
    var h = new Date().getHours();
    var greet = h < 12 ? "Good morning" : (h < 17 ? "Good afternoon" : "Good evening");
    speakOrSkip(greet + ". Sai online. How can I help?");
  });

  function sendTyped() {
    var v = $("typed").value.trim();
    if (!v || busy) { return; }
    $("typed").value = "";
    ask(v);
  }
  $("send").addEventListener("click", sendTyped);
  $("typed").addEventListener("keydown", function (e) { if (e.key === "Enter") { sendTyped(); } });
  if (window.speechSynthesis) { window.speechSynthesis.onvoiceschanged = function () {}; }
  if (!SR) { $("hint").textContent = "Voice input needs Chrome or Edge. You can still type to Sai."; $("hint").className = "hint warn"; }
})();
</script>
</body>
</html>
